apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-operator-config
  namespace: flux-system
spec:
  dependsOn:
  - name: external-secrets-operator-controller
  interval: 5m
  path: "./infrastructure/external-secrets-operator/config/kustomize/dev"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
