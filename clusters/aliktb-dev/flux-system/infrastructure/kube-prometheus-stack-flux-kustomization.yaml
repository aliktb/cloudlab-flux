apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 5m
  path: "./infrastructure/kube-prometheus-stack/controller/kustomize/dev"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
