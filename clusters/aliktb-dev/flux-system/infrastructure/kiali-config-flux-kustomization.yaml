apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kiali-config
  namespace: flux-system
spec:
  dependsOn:
  - name: kiali-controller
  interval: 5m
  path: "./infrastructure/kiali/config/kustomize/dev"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
