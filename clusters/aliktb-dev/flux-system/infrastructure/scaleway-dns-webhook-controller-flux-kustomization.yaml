apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scaleway-certmanager-dns-webhook
  namespace: flux-system
spec:
  dependsOn:
  - name: cert-manager-controller
  - name: external-secrets-operator-config
  interval: 5m
  path: "./infrastructure/scaleway-dns-webhook/controller/kustomize/dev"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
