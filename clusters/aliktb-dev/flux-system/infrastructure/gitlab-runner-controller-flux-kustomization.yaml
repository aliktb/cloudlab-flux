apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitlab-runner-controller
  namespace: flux-system
spec:
  dependsOn:
  - name: external-secrets-operator-config
  interval: 5m
  path: "./infrastructure/gitlab-runner/controller/kustomize/dev"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
