apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  dependsOn:
  - name: alloy
  interval: 5m
  path: "./infrastructure/loki/controller/kustomize/dev"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
