apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
spec:
  auth:
    strategy: anonymous
  external_services:
    grafana:
      enabled: true
      external_url: "https://grafana.dev.internal.aliktb.com"
      internal_url: "http://kube-prometheus-stack-grafana.monitoring"
    prometheus:
      url: http://kube-prometheus-stack-prometheus.monitoring:9090
