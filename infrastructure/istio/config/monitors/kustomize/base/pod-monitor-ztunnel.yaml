apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    release: kube-prometheus-stack
  name: ztunnel
  namespace: istio-system
spec:
  namespaceSelector:
    matchNames:
    - istio-system
  podMetricsEndpoints:
  - interval: 15s
    path: /stats/prometheus
    port: ztunnel-stats
  selector:
    matchLabels:
      app: ztunnel
