apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    tailscale.com/hostname: istio-internal-shared-gateway
  name: internal-shared-gateway
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gateway-config
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    hostname: "*.dev.internal.aliktb.com"
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    hostname: "*.dev.internal.aliktb.com"
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: aliktb-com-tls
      mode: Terminate
