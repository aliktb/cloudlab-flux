apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.20.x"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
      interval: 12h
  valuesFrom:
  - name: external-dns-config
    kind: ConfigMap
  - kind: Secret
    name: scaleway-dns-api-keys
    valuesKey: SCW_ACCESS_KEY
    targetPath: env[0].value
  - kind: Secret
    name: scaleway-dns-api-keys
    valuesKey: SCW_SECRET_KEY
    targetPath: env[1].value
