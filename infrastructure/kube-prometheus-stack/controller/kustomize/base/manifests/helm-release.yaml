apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: monitoring
      version: '81.2.x'
  interval: 30m
  valuesFrom:
  - kind: ConfigMap
    name: kube-prometheus-stack-values
    valuesKey: values.yaml
