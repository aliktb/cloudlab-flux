apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  chart:
    spec:
      chart: loki
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      version: '6.52.x'
  interval: 30m
  valuesFrom:
  - kind: ConfigMap
    name: loki-config
    valuesKey: values.yaml
