apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chart:
    spec:
      chart: external-secrets
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
      version: 1.3.1
  interval: 10m
  releaseName: external-secrets
  targetNamespace: external-secrets
  values:
    installCRDs: true
